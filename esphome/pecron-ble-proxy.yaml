# ESPHome Bluetooth proxy for the Pecron (Bluetooth) integration, for a generic
# ESP32-C3 board (native USB). The integration needs a proxy because BlueZ
# can't subscribe to 0x9C40 for indications; see the README.
#
# Secrets live in esphome/secrets.yaml (git-ignored):
#   wifi_ssid, wifi_password: the network the proxy joins
#   api_encryption_key: Home Assistant asks for this when you add the device
#   ota_password:       used for later over-the-air updates
#
# If it can't join that network, it opens a "Pecron BLE Proxy Setup" access
# point (and Improv over Bluetooth/USB) so you can set Wi-Fi from there.
#
# Build and flash over USB:
#   esphome/.venv/bin/esphome run esphome/pecron-ble-proxy.yaml --device /dev/cu.usbmodemXXXX

esphome:
  name: pecron-ble-proxy
  friendly_name: Pecron BLE Proxy
  min_version: 2026.11.0

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback hotspot if it can't join the network above.
  ap:
    ssid: "Pecron BLE Proxy Setup"

captive_portal:

improv_serial:

esp32_improv:
  authorizer: none

esp32_ble_tracker:
  scan_parameters:
    # Active scanning so the proxy can make connections. Interval == window
    # matches ESPHome's own proxy builds for single-radio chips like the C3.
    active: true
    interval: 1100ms
    window: 1100ms

bluetooth_proxy:
  active: true

button:
  - platform: safe_mode
    name: Safe Mode Boot
  - platform: restart
    name: Restart

sensor:
  - platform: wifi_signal
    name: Wi-Fi Signal
    update_interval: 60s
